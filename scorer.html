<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scorer</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/scorer.css">
    <link rel="stylesheet" href="css/common.css">

    <script type="module" src="js/scorer/scorer.js" defer></script>
</head>

<body>
    <section class="section scorer-shell" id="scorer-section">
        <div class="upper-part">
            <header class="scorer-heading">Men's Singles</header>

            <div class="match-result">
                <div class="player-scores green-player-scores">
                    <div class="player-name-in-set-score green-player" id="green-player-name-in-set-score">
                        Player A
                    </div>
                    <div class="set-scores" id="green-set-scores"></div>
                </div>

                <hr class="set-score-line">

                <div class="player-scores green-player-scores">
                    <div class="player-name-in-set-score orange-player" id="orange-player-name-in-set-score">
                        Player B
                    </div>
                    <div class="set-scores" id="orange-set-scores"></div>
                </div>
            </div>

        </div>

        <div class="overlay interval-overlay is-div-hidden">
            <div class="interval-interface interface">
                <div class="message interval-message">
                    Interval
                </div>

                <div class="timer-options" id="interval-options">
                    <button class="control-btn interval-btn" id="reset-interval-btn">
                        <img src="icons/reset.svg" alt="Reset">
                    </button>
                    <div class="timer" id="interval-timer">01:00</div>
                    <button class="control-btn interval-btn" id="pause-interval-btn">
                        <img src="icons/pause.svg" alt="Pause" id="pause-interval-icon">
                    </button>
                </div>

                <button class="primary-action-btn" id="continue-btn">
                    Continue
                </button>

            </div>
        </div>

        <div class="overlay set-result-overlay is-div-hidden">
            <div class="set-result-interface interface">
                <div class="set-result-message message">
                    <span class="set-num">Set-1</span>
                    <span>won by</span>
                    <span class="winner-name set-winner-name">Player A</span>
                </div>
                <div class="timer-options" id="set-timer-options">
                    <button class="control-btn set-timer-btn" id="reset-set-time-btn">
                        <img src="icons/reset.svg" alt="Reset">
                    </button>

                    <div class="timer" id="set-timer">01:00</div>

                    <button class="control-btn set-timer-btn" id="pause-set-time-btn">
                        <img src="icons/pause.svg" alt="Pause" id="pause-set-time-icon">
                    </button>
                </div>

                <button class="primary-action-btn" id="next-set-btn">
                    Next Set
                </button>
            </div>
        </div>

        <div class="overlay match-result-overlay is-div-hidden">
            <div class="match-result-interface interface">
                <div class="match-result-message message">
                    Match won by
                    <span class="match-winner-name">Player A</span>
                </div>

                <div class="final-set-score">
                    <span class="final-green-sets green-player">2</span>
                    <span class="dash">-</span>
                    <span class="final-orange-sets orange-player">1</span>
                </div>

                <div class="btns-row">
                    <button class="primary-action-btn" id="view-scorecard-btn">
                        View Scorecard
                    </button>
                    <button class="secondary-action-btn" id="new-match-btn">
                        New Match
                    </button>
                </div>

            </div>
        </div>

        <div class="scoring-interface">
            <hr class="scorer-line">

            <div class="points-interface">
                <div class="player-side" id="green-side">
                    <button class="one-point green-bg thin-green-border" id="green-one-point">
                        +1
                    </button>

                    <div class="player-court" id="green-court">
                        <div class="service-court left-court"></div>
                        <div class="service-court right-court"></div>

                        <div class="player-info player-on-left-side player-on-right-court" id="green-player1-info">
                            <div class="green-player player-name-in-match" id="green-player1-name-in-match">
                                Player A
                            </div>
                            <div class="serve current-server"></div>
                        </div>

                        <div class="player-info player-on-left-side player-on-left-court is-div-hidden"
                            id="green-player2-info">
                            <div class="green-player player-name-in-match" id="green-player2-name-in-match">
                                Player B
                            </div>
                            <div class="serve"></div>
                        </div>

                    </div>
                </div>

                <div class="pre-game-controls" id="singles-pre-game-controls">
                    <button class="pre-game-control" id="change-sides">
                        <svg width="22" height="18" viewBox="0 0 22 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M21.8536 4.03553C22.0488 3.84027 22.0488 3.52369 21.8536 3.32842L18.6716 0.146442C18.4763 -0.0488198 18.1597 -0.0488198 17.9645 0.146442C17.7692 0.341705 17.7692 0.658287 17.9645 0.853549L20.7929 3.68198L17.9645 6.5104C17.7692 6.70567 17.7692 7.02225 17.9645 7.21751C18.1597 7.41277 18.4763 7.41277 18.6716 7.21751L21.8536 4.03553ZM0.5 3.68198L0.5 4.18198L21.5 4.18198V3.68198V3.18198L0.5 3.18198L0.5 3.68198Z"
                                fill="white" />
                            <path
                                d="M0.146446 13.3284C-0.0488148 13.5237 -0.0488148 13.8403 0.146446 14.0355L3.32843 17.2175C3.52369 17.4128 3.84027 17.4128 4.03553 17.2175C4.2308 17.0222 4.2308 16.7057 4.03553 16.5104L1.20711 13.682L4.03553 10.8535C4.2308 10.6583 4.2308 10.3417 4.03553 10.1464C3.84027 9.95118 3.52369 9.95118 3.32843 10.1464L0.146446 13.3284ZM21.5 13.682V13.182L0.5 13.182V13.682V14.182L21.5 14.182V13.682Z"
                                fill="white" />
                        </svg>

                    </button>
                    <button class="pre-game-control" id="change-serve">
                        <svg width="22" height="20" viewBox="0 0 22 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M21.6025 5.39406C21.8728 5.33749 22.0461 5.07252 21.9895 4.80223L21.0676 0.397673C21.011 0.127388 20.7461 -0.045862 20.4758 0.0107095C20.2055 0.0672809 20.0322 0.332251 20.0888 0.602536L20.9083 4.5177L16.9931 5.33715C16.7228 5.39372 16.5496 5.65869 16.6061 5.92898C16.6627 6.19926 16.9277 6.37251 17.198 6.31594L21.6025 5.39406ZM0.500099 4.90466C0.864199 5.24734 0.86401 5.24755 0.863851 5.24771C0.863839 5.24773 0.86371 5.24786 0.863684 5.24789C0.863633 5.24795 0.863702 5.24787 0.863892 5.24767C0.864271 5.24727 0.865131 5.24637 0.866471 5.24498C0.869151 5.24219 0.873749 5.23743 0.880252 5.23081C0.89326 5.21756 0.913887 5.19683 0.94204 5.1694C0.998354 5.11454 1.08472 5.0329 1.2004 4.93064C1.43184 4.72605 1.78004 4.4394 2.23905 4.1196C3.15766 3.47958 4.51542 2.71 6.26573 2.19698C9.74588 1.17693 14.845 1.15065 21.2265 5.32315L21.5001 4.90466L21.7737 4.48618C15.1552 0.158677 9.75432 0.132391 5.98446 1.23735C4.10978 1.78682 2.65504 2.61099 1.6674 3.2991C1.17328 3.64336 0.794925 3.95437 0.538082 4.18142C0.409618 4.29498 0.311415 4.38766 0.244194 4.45316C0.210579 4.48591 0.184697 4.51187 0.166638 4.53027C0.157608 4.53947 0.150533 4.54677 0.145423 4.55209C0.142868 4.55475 0.140804 4.55691 0.139233 4.55856C0.138448 4.55939 0.137785 4.56009 0.137246 4.56066C0.136977 4.56094 0.136665 4.56127 0.13653 4.56142C0.136249 4.56171 0.135999 4.56198 0.500099 4.90466Z"
                                fill="white" />
                            <path
                                d="M0.397667 14.4153C0.127382 14.4718 -0.0458679 14.7368 0.010704 15.0071L0.932589 19.4117C0.989159 19.6819 1.25413 19.8552 1.52441 19.7986C1.7947 19.742 1.96795 19.4771 1.91138 19.2068L1.09193 15.2916L5.00709 14.4722C5.27737 14.4156 5.45062 14.1506 5.39405 13.8803C5.33748 13.6101 5.07251 13.4368 4.80223 13.4934L0.397667 14.4153ZM21.5001 14.9047C21.136 14.562 21.1362 14.5618 21.1363 14.5616C21.1364 14.5616 21.1365 14.5615 21.1365 14.5614C21.1366 14.5614 21.1365 14.5615 21.1363 14.5617C21.1359 14.5621 21.1351 14.563 21.1337 14.5643C21.131 14.5671 21.1264 14.5719 21.1199 14.5785C21.1069 14.5918 21.0863 14.6125 21.0582 14.6399C21.0018 14.6948 20.9155 14.7764 20.7998 14.8787C20.5684 15.0833 20.2202 15.3699 19.7611 15.6897C18.8425 16.3297 17.4848 17.0993 15.7345 17.6123C12.2543 18.6324 7.15519 18.6587 0.773724 14.4862L0.500099 14.9047L0.226475 15.3231C6.84501 19.6506 12.2459 19.6769 16.0157 18.572C17.8904 18.0225 19.3452 17.1983 20.3328 16.5102C20.8269 16.166 21.2053 15.855 21.4621 15.6279C21.5906 15.5143 21.6888 15.4217 21.756 15.3562C21.7896 15.3234 21.8155 15.2975 21.8336 15.2791C21.8426 15.2699 21.8497 15.2626 21.8548 15.2572C21.8573 15.2546 21.8594 15.2524 21.861 15.2508C21.8618 15.2499 21.8624 15.2492 21.863 15.2487C21.8632 15.2484 21.8635 15.2481 21.8637 15.2479C21.8639 15.2476 21.8642 15.2473 21.5001 14.9047Z"
                                fill="white" />
                            <circle cx="11.0001" cy="10.4047" r="3.5" fill="white" />
                        </svg>

                    </button>
                </div>

                <div class="pre-game-controls is-div-hidden" id="doubles-pre-game-controls">
                    <button class="pre-game-control" id="change-courts-green">
                        <svg class="change-courts-icon" width="22" height="18" viewBox="0 0 22 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M21.8536 4.03553C22.0488 3.84027 22.0488 3.52369 21.8536 3.32842L18.6716 0.146442C18.4763 -0.0488198 18.1597 -0.0488198 17.9645 0.146442C17.7692 0.341705 17.7692 0.658287 17.9645 0.853549L20.7929 3.68198L17.9645 6.5104C17.7692 6.70567 17.7692 7.02225 17.9645 7.21751C18.1597 7.41277 18.4763 7.41277 18.6716 7.21751L21.8536 4.03553ZM0.5 3.68198L0.5 4.18198L21.5 4.18198V3.68198V3.18198L0.5 3.18198L0.5 3.68198Z"
                                fill="white" />
                            <path
                                d="M0.146446 13.3284C-0.0488148 13.5237 -0.0488148 13.8403 0.146446 14.0355L3.32843 17.2175C3.52369 17.4128 3.84027 17.4128 4.03553 17.2175C4.2308 17.0222 4.2308 16.7057 4.03553 16.5104L1.20711 13.682L4.03553 10.8535C4.2308 10.6583 4.2308 10.3417 4.03553 10.1464C3.84027 9.95118 3.52369 9.95118 3.32843 10.1464L0.146446 13.3284ZM21.5 13.682V13.182L0.5 13.182V13.682V14.182L21.5 14.182V13.682Z"
                                fill="white" />
                        </svg>

                    </button>
                    <button class="pre-game-control" id="change-courts-orange">
                        <svg class="change-courts-icon" width="22" height="18" viewBox="0 0 22 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M21.8536 4.03553C22.0488 3.84027 22.0488 3.52369 21.8536 3.32842L18.6716 0.146442C18.4763 -0.0488198 18.1597 -0.0488198 17.9645 0.146442C17.7692 0.341705 17.7692 0.658287 17.9645 0.853549L20.7929 3.68198L17.9645 6.5104C17.7692 6.70567 17.7692 7.02225 17.9645 7.21751C18.1597 7.41277 18.4763 7.41277 18.6716 7.21751L21.8536 4.03553ZM0.5 3.68198L0.5 4.18198L21.5 4.18198V3.68198V3.18198L0.5 3.18198L0.5 3.68198Z"
                                fill="white" />
                            <path
                                d="M0.146446 13.3284C-0.0488148 13.5237 -0.0488148 13.8403 0.146446 14.0355L3.32843 17.2175C3.52369 17.4128 3.84027 17.4128 4.03553 17.2175C4.2308 17.0222 4.2308 16.7057 4.03553 16.5104L1.20711 13.682L4.03553 10.8535C4.2308 10.6583 4.2308 10.3417 4.03553 10.1464C3.84027 9.95118 3.52369 9.95118 3.32843 10.1464L0.146446 13.3284ZM21.5 13.682V13.182L0.5 13.182V13.682V14.182L21.5 14.182V13.682Z"
                                fill="white" />
                        </svg>
                    </button>
                </div>

                <div class="player-side" id="orange-side">
                    <div class="player-court" id="orange-court">
                        <div class="service-court left-court"></div>
                        <div class="service-court right-court"></div>

                        <div class="player-info player-on-right-side player-on-right-court" id="orange-player1-info">
                            <div class="orange-player player-name-in-match" id="orange-player1-name-in-match">
                                Player C
                            </div>
                            <div class="serve"></div>
                        </div>

                        <div class="player-info player-on-right-side player-on-left-court is-div-hidden"
                            id="orange-player2-info">
                            <div class="orange-player player-name-in-match" id="orange-player2-name-in-match">
                                Player D
                            </div>
                            <div class="serve"></div>
                        </div>

                    </div>
                    <button class="one-point orange-bg thin-orange-border" id="orange-one-point">
                        +1
                    </button>
                </div>

            </div>

            <hr class="scorer-line">
        </div>

        <div class="game-controls">
            <div class="scoring-options">
                <button class="control-btn scoring-option-btn" id="undo">
                    <img src="icons/undo.svg" alt="Undo" id="undo-icon">

                </button>
                <button class="control-btn scoring-option-btn" id="redo">
                    <img src="icons/redo.svg" alt="redo" id="redo-icon">

                </button>

                <div class="timer" id="match-timer">00:00:00</div>

                <button class="control-btn scoring-option-btn" id="pause">
                    <img id="pause-icon" src="icons/pause.svg" alt="Pause">
                </button>

                <button class="control-btn scoring-option-btn" id="exit">
                    <img src="icons/exit.svg" alt="Exit" id="exit-icon">

                </button>
            </div>
        </div>

    </section>
</body>

</html>
