<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scorecard</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/scorecard.css">
</head>

<body>
    <section class="section" id="scorecard-section">
        <header class="section-heading">
            Scorecard
            <hr class="line">
        </header>

        <section class="sub-section opponents-section">
            <h2 class="opponents-header header">
                Men's Singles
            </h2>

            <section class="opponents-cont">
                <section class="opponent-cont green-opponent-cont">
                    <div class="player-name green-player-name">
                        Arya
                    </div>
                    <div class="team-name green-team green-player">
                        23MS
                    </div>
                </section>

                <section class="opponent-cont orange-opponent-cont">
                    <div class="player-name orange-player-name">
                        Shashank
                    </div>
                    <div class="team-name green-team orange-player">
                        22MS
                    </div>
                </section>
            </section>

        </section>

        <section class="sub-section results-section">
            <h2 class="header results-header">
                Scores
            </h2>

            <section class="results-cont">
                <div class="set-scores set-1-score green-bg">
                    <div class="set-score green-score green-player">21</div>
                    <div class="dash">-</div>
                    <div class="set-score orange-score">16</div>
                </div>

                <div class="set-scores set-2-score orange-bg">
                    <div class="set-score green-score">18</div>
                    <div class="dash">-</div>
                    <div class="set-score orange-score orange-player">21</div>
                </div>

                <div class="set-scores set-3-score green-bg">
                    <div class="set-score green-score green-player">21</div>
                    <div class="dash">-</div>
                    <div class="set-score orange-score">15</div>
                </div>
            </section>
        </section>

        <section class="sub-section winner-section green-bg green-border">
            Match won by
            <span class="winner-player-name player-name">Arya</span>
            <span class="winner-team-name green-player">(23MS)</span>
        </section>

    </section>
</body>

</html>
