<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scorecard</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/scorecard.css">

    <script src="js/scorecard.js" defer></script>
</head>

<body>
    <section class="section" id="scorecard-section">
        <header class="section-heading">
            Scorecard
            <hr class="line">
        </header>

        <section class="sub-section opponents-section">
            <h2 class="opponents-header header">
                Men's Singles
            </h2>

            <section class="opponents-cont">
                <section class="opponent-cont green-opponent-cont">
                    <div class="player-name" id="green-player-name">
                        Arya
                    </div>
                    <div class="team-name green-player" id="green-team-name">
                        23MS
                    </div>
                </section>

                <section class="opponent-cont orange-opponent-cont">
                    <div class="player-name" id="orange-player-name">
                        Shashank
                    </div>
                    <div class="team-name orange-player" id="orange-team-name">
                        22MS
                    </div>
                </section>
            </section>

        </section>

        <section class="sub-section results-section">
            <h2 class="header results-header">
                Scores
            </h2>

            <section class="results-cont"></section>
        </section>

        <section class="sub-section winner-section">
            Match won by
            <span class="player-name" id="winner-player-name">Arya</span>
            <span id="winner-team-name">(23MS)</span>
        </section>

    </section>
</body>

</html>
