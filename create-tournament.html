<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d0f14">
    <title>Create Tournament</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/create-tournament.css">

    <script type="module" src="js/create-tournament/create-tournament.js" defer></script>
</head>

<body>
    <main class="create-tournament-page app-page">

        <header class="page-header">
            <button class="back-btn" id="back-btn" type="button" aria-label="Back">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M19 12H5"></path>
                    <path d="m12 19-7-7 7-7"></path>
                </svg>
            </button>

            <h1>Create Tournament</h1>
        </header>

        <form id="tournament-form" novalidate>

            <section class="form-section">
                <label class="section-label" for="tournament-name">
                    Tournament Name
                </label>

                <input
                    class="text-input"
                    id="tournament-name"
                    name="tournamentName"
                    type="text"
                    placeholder="Enter tournament name"
                    autocomplete="off"
                >
            </section>

            <section class="form-section">
                <label class="section-label" for="start-date">
                    Start Date
                </label>

                <button class="date-input" id="start-date" type="button" aria-haspopup="dialog" aria-expanded="false">
                    <span class="calendar-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <rect x="3" y="5" width="18" height="16" rx="2"></rect>
                            <path d="M16 3v4"></path>
                            <path d="M8 3v4"></path>
                            <path d="M3 10h18"></path>
                        </svg>
                    </span>

                    <span class="date-value" id="date-value"></span>

                    <span class="date-chevron" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <path d="m7 10 5 5 5-5"></path>
                        </svg>
                    </span>
                </button>

                <div class="calendar-picker" id="calendar-picker" role="dialog" aria-label="Choose start date" hidden>
                    <div class="calendar-header">
                        <button class="calendar-nav-btn" id="previous-month" type="button" aria-label="Previous month">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="m15 18-6-6 6-6"></path>
                            </svg>
                        </button>

                        <h2 id="calendar-month"></h2>

                        <button class="calendar-nav-btn" id="next-month" type="button" aria-label="Next month">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="m9 18 6-6-6-6"></path>
                            </svg>
                        </button>
                    </div>

                    <div class="calendar-weekdays" aria-hidden="true">
                        <span>Sun</span>
                        <span>Mon</span>
                        <span>Tue</span>
                        <span>Wed</span>
                        <span>Thu</span>
                        <span>Fri</span>
                        <span>Sat</span>
                    </div>

                    <div class="calendar-days" id="calendar-days"></div>
                </div>
            </section>

            <section class="form-section">
                <h2 class="section-label">Type</h2>

                <div class="tournament-type-options" id="tournament-type-options" role="group" aria-label="Tournament type">
                    <button class="tournament-type-card selected" type="button" data-type="Team based" aria-pressed="true">
                        Team based
                    </button>
                    <button class="tournament-type-card" type="button" data-type="Individual" aria-pressed="false">
                        Individual
                    </button>
                </div>
            </section>

            <section class="form-section">
                <label class="section-label" for="tournament-category">
                    Category
                </label>

                <select class="category-input" id="tournament-category" name="category">
                    <option value="Men's">Men's</option>
                    <option value="Women's">Women's</option>
                    <option value="Mixed">Mixed</option>
                    <option value="Overall">Overall</option>
                </select>
            </section>

            <section class="form-section teams-section">
                <h2 class="section-label">Participating Teams</h2>

                <div class="teams-list" id="teams-list"></div>

                <div class="add-item-container" id="add-team-container">
                    <button class="add-item-btn" id="add-team-btn" type="button">
                        <svg class="plus-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 5v14"></path>
                            <path d="M5 12h14"></path>
                        </svg>
                        <span>Add a team</span>
                    </button>
                </div>
            </section>

            <button class="primary-action-btn create-tournament-btn" type="submit">
                <span>Add Tournament</span>
            </button>

        </form>
    </main>
</body>

</html>
