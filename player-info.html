<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Info</title>

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/player-info.css">

    <script src="js/player-info.js" defer></script>
</head>

<body>
    <section class="section" id="player-info-section">
        <!-- Heading -->
        <header class="section-heading">
            Player Info
            <hr class="line">
        </header>

        <!-- Team green player form section -->
        <section class="team-player-form" id="team-green-player-form">
            <label class="green-player team-header" id="team-green-header">Team Green</label>
        </section>

        <!-- Team orange player form section -->
        <section class="team-player-form" id="team-orange-player-form">
            <label class="orange-player team-header" id="team-orange-header">Team Orange</label>
        </section>

        <!-- Start match button -->
        <button class="primary-action-btn" id="start-match-btn">Start Match</button>

    </section>
</body>

</html>
