<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#080808">
    <title>Select Tournament</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/select-tournament.css">

    <script src="js/select-tournament.js" defer></script>
</head>

<body>
    <main class="select-tournament-page app-page">
        <header class="page-header">
            <button class="back-btn" type="button" aria-label="Go back">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M19 12H5"></path>
                    <path d="m12 19-7-7 7-7"></path>
                </svg>
            </button>
            <h1>Select Tournament</h1>
        </header>

        <section class="tournaments-section">
            <h2 class="header active-heading">Active</h2>
            <div class="tournament-list" id="tournament-list"></div>
        </section>

        <button class="primary-action-btn create-tournament-btn" id="create-tournament-btn"
            type="button">
            <svg class="plus-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 5v14"></path>
                <path d="M5 12h14"></path>
            </svg>
            Create Tournament
        </button>
    </main>
</body>

</html>
